# Development:  docker compose up -d mongo redis   (then run the app with npm run dev)
# Full stack:   docker compose --profile app up --build   -> http://localhost:8080 (2 app servers + nginx)
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app1: &app
    profiles: ["app"]
    build: .
    environment: &appenv
      MONGO_URI: mongodb://mongo:27017/pinboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-long-random-string
      CLIENT_URL: http://localhost:8080
    depends_on: [mongo, redis]

  app2:
    <<: *app

  nginx:
    profiles: ["app"]
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app1, app2]

volumes:
  mongo-data:   # notes, users AND uploaded files (GridFS)
