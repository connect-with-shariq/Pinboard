# Runs on every push / pull request: makes sure the server code is valid and the React app builds
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server
        run: npm install --prefix server

      - name: Check server code
        run: for f in $(find server/src -name "*.js"); do node --check "$f"; done

      - name: Install & build client
        run: npm install --prefix client && npm run build --prefix client
